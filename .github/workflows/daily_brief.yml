name: Daily Economic Brief Automation

on:
  schedule:
    # 매일 한국 시간(KST) 아침 06:00 = UTC 21:00
    - cron: '0 21 * * *'
  workflow_dispatch: # 수동 실행 버튼 활성화

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Brief Generation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_brief.py

      - name: Commit and Push Updated data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes detected in data.json. Skipping commit."
          else
            TODAY=$(TZ=Asia/Seoul date '+%Y-%m-%d')
            git commit -m "chore(data): update daily brief for ${TODAY} [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
